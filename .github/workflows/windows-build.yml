name: Compilar BAEL en Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar y preparar la aplicación
        run: dotnet publish src/Bael/Bael.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
      - name: Probar arranque y chat sin conexión
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "bael-smoke.txt"
          Remove-Item -LiteralPath $result -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "./publish/Bael.exe" -ArgumentList "--smoke-test", ('"' + $result + '"') -PassThru
          if (!$process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            throw "BAEL no terminó la prueba de arranque en 30 segundos."
          }
          if (!(Test-Path -LiteralPath $result)) {
            throw "BAEL terminó sin dejar resultado. Código de salida: $($process.ExitCode)."
          }
          $report = Get-Content -LiteralPath $result -Raw
          if ($process.ExitCode -ne 0 -or $report.Trim() -ne "OK") {
            throw "Falló la prueba de BAEL: $report"
          }
          Write-Host "Ventana, chat y perfiles verificados."
      - name: Guardar la aplicación para probar en Windows
        uses: actions/upload-artifact@v4
        with:
          name: BAEL-Windows-x64
          path: publish/
          if-no-files-found: error
