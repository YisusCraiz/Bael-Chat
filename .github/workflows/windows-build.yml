name: Compilar BAEL en Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compilar y preparar la aplicación
        run: dotnet publish src/Bael/Bael.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
      - name: Probar arranque y chat sin conexión
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "bael-smoke.txt"
          Remove-Item -LiteralPath $result -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "./publish/BAEL-UMAN.exe" -ArgumentList "--smoke-test", ('"' + $result + '"') -PassThru
          if (!$process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            throw "BAEL no terminó la prueba de arranque en 30 segundos."
          }
          if (!(Test-Path -LiteralPath $result)) {
            throw "BAEL terminó sin dejar resultado. Código de salida: $($process.ExitCode)."
          }
          $report = Get-Content -LiteralPath $result -Raw
          if ($process.ExitCode -ne 0 -or $report.Trim() -ne "OK") {
            throw "Falló la prueba de BAEL: $report"
          }
          Write-Host "Ventana, chat y perfiles verificados."
      - name: Probar lectura local de inventario en Windows
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP "bael-inventory.txt"
          $process = Start-Process -FilePath "./publish/BAEL-UMAN.exe" -ArgumentList '--system-inventory-test', ('"' + $result + '"') -PassThru
          if (!$process.WaitForExit(45000)) { Stop-Process $process.Id -ErrorAction SilentlyContinue; throw "La lectura del inventario no terminó." }
          if (!(Test-Path $result)) { throw "El lector no dejó resultado." }
          $report = Get-Content $result -Raw
          if ($process.ExitCode -ne 0 -or !$report.StartsWith('OK')) { throw "Falló la lectura de hardware: $report" }
          Write-Host $report
      - name: Crear instalador de Windows
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup." }
          }
          & $compiler "/DAppVersion=0.1.${{ github.run_number }}" "installer/BAEL.iss"
          if ($LASTEXITCODE -ne 0) { throw "Falló la creación del instalador." }
      - name: Probar instalación, arranque y desinstalación
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "BAEL-install-test"
          $setup = Start-Process "./dist/BAEL-Setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', ('/DIR="' + $target + '"') -PassThru
          if (!$setup.WaitForExit(120000)) { Stop-Process $setup.Id; throw "La instalación no terminó." }
          if ($setup.ExitCode -ne 0) { throw "Falló la instalación: $($setup.ExitCode)" }
          $result = Join-Path $env:RUNNER_TEMP "bael-installed-smoke.txt"
          $app = Start-Process (Join-Path $target "BAEL-UMAN.exe") -ArgumentList '--smoke-test', ('"' + $result + '"') -PassThru
          if (!$app.WaitForExit(30000)) { Stop-Process $app.Id; throw "La aplicación instalada no terminó la prueba." }
          if ($app.ExitCode -ne 0 -or !(Test-Path $result) -or (Get-Content $result -Raw).Trim() -ne "OK") {
            throw "La aplicación instalada no pasó la prueba."
          }
          $uninstall = Start-Process (Join-Path $target "unins000.exe") -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -PassThru
          if (!$uninstall.WaitForExit(60000)) { Stop-Process $uninstall.Id; throw "La desinstalación no terminó." }
          if ($uninstall.ExitCode -ne 0 -or (Test-Path (Join-Path $target "BAEL-UMAN.exe"))) {
            throw "La desinstalación no retiró la aplicación."
          }
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: BAEL-Installer
          path: dist/BAEL-Setup.exe
          if-no-files-found: error
      - name: Guardar la aplicación para probar en Windows
        uses: actions/upload-artifact@v4
        with:
          name: BAEL-Windows-x64
          path: publish/
          if-no-files-found: error


  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BAEL-Installer
          path: dist
      - name: Publicar descarga en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BAEL_VERSION: v0.1.${{ github.run_number }}
          BAEL_COMMIT: ${{ github.sha }}
        run: |
          sha256sum dist/BAEL-Setup.exe > dist/SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Descarga BAEL-Setup.exe para instalar BAEL en Windows x64.
          Incluye el runtime de .NET, los sprites y accesos directos.
          La instalación y la aplicación instalada pasaron pruebas automáticas en Windows.
          Configura tus claves de conversación y ElevenLabs desde la rueda de Ajustes.
          Esta versión inicial todavía requiere pruebas visuales y de audio en tu PC.
          El instalador no tiene firma digital.
          NOTES
          gh release create "$BAEL_VERSION" dist/BAEL-Setup.exe dist/SHA256SUMS.txt --repo "$GH_REPO" --target "$BAEL_COMMIT" --title "BAEL $BAEL_VERSION para Windows" --notes-file release-notes.md --latest
